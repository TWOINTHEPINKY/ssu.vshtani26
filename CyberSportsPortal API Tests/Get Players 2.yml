info:
  name: Get Players 2
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/Players/filter?filter=Alpha"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filter
      value: Alpha
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const response = res.body;
        test('Проверка: ответ - массив, содержащий поля id у первого элемента.', function() {
          expect(response).to.be.an('array');
          if (response.length > 0) {
            expect(response[0]).to.have.property('id');
            expect(response[0]).to.have.property('combinedName');
          } else {
            console.warn('По вашему фильтру ничего не найдено!');
          }
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
